name: Deploy Yandex Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-cloud
  cancel-in-progress: false

jobs:
  deploy-yandex-cloud:
    runs-on: ubuntu-latest
    env:
      YANDEX_PROJECT_NAME: ${{ vars.YANDEX_PROJECT_NAME || 'b2e-metallokonstrukcii' }}
      YANDEX_SITE_BUCKET: ${{ vars.YANDEX_SITE_BUCKET || 'metallb2e.ru' }}
      YANDEX_STATS_BUCKET: ${{ vars.YANDEX_STATS_BUCKET || 'b2e-metallokonstrukcii-stats' }}
      YANDEX_FUNCTION_NAME: ${{ vars.YANDEX_FUNCTION_NAME || 'b2e-leads' }}
      YANDEX_GATEWAY_NAME: ${{ vars.YANDEX_GATEWAY_NAME || 'b2e-metallokonstrukcii-gateway' }}
      YANDEX_SERVICE_ACCOUNT_NAME: ${{ vars.YANDEX_SERVICE_ACCOUNT_NAME || 'b2e-metallokonstrukcii-sa' }}
      YANDEX_SECRET_NAME: ${{ vars.YANDEX_SECRET_NAME || 'b2e-metallokonstrukcii-smtp' }}
      YANDEX_CUSTOM_DOMAIN: ${{ vars.YANDEX_CUSTOM_DOMAIN }}
      YANDEX_CERTIFICATE_ID: ${{ vars.YANDEX_CERTIFICATE_ID }}
      YANDEX_ALLOWED_ORIGIN: ${{ vars.YANDEX_ALLOWED_ORIGIN }}
      YANDEX_FUNCTION_SECRET_KEYS: ${{ vars.YANDEX_FUNCTION_SECRET_KEYS }}
      YANDEX_SKIP_SECRET_UPDATE: ${{ vars.YANDEX_SKIP_SECRET_UPDATE }}
      B2E_CONTACT_PHONE: ${{ vars.B2E_CONTACT_PHONE || '+79650578270' }}
      B2E_CONTACT_PHONE_DISPLAY: ${{ vars.B2E_CONTACT_PHONE_DISPLAY || '+7 (965) 057-82-70' }}
      B2E_WORK_HOURS: ${{ vars.B2E_WORK_HOURS || 'Пн-Пт 09:00 - 18:00' }}
      B2E_CONTACT_EMAIL: ${{ vars.B2E_CONTACT_EMAIL || 'zakaz@b2energy.ru' }}
      B2E_MAX_URL: ${{ vars.B2E_MAX_URL || 'https://max.ru/u/f9LHodD0cOIq9CnGVeR2XIVeHPu_GpeOl3tdE_eGIeC3kbz6i8FikJr_4IM' }}
      B2E_ADDRESS: ${{ vars.B2E_ADDRESS || 'Санкт-Петербург, ул. Седова, 57, лит. В, помещ. 11-Н, ком. 3' }}
      B2E_YANDEX_MAP_URL: ${{ vars.B2E_YANDEX_MAP_URL || 'https://yandex.ru/maps/-/CPSAzCMe' }}
      B2E_YANDEX_MAP_EMBED_URL: ${{ vars.B2E_YANDEX_MAP_EMBED_URL }}
      B2E_RBC_PROFILE_URL: ${{ vars.B2E_RBC_PROFILE_URL || 'https://companies.rbc.ru/amp/ogrn/1247800091098/' }}
      B2E_RUSPROFILE_URL: ${{ vars.B2E_RUSPROFILE_URL || 'https://www.rusprofile.ru/id/1247800091098' }}
      B2E_CATALOG_URL: ${{ vars.B2E_CATALOG_URL || './assets/documents/b2e-metallokonstrukcii-catalog.pdf' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      SMTP_ENVELOPE_FROM: ${{ secrets.SMTP_ENVELOPE_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      LEAD_WEBHOOK_URL: ${{ secrets.LEAD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMARTCAPTCHA_SERVER_KEY: ${{ secrets.SMARTCAPTCHA_SERVER_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and package site
        run: npm run check

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        id: yc
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          if [ -z "$YC_SERVICE_ACCOUNT_KEY_JSON" ] || [ -z "$YC_CLOUD_ID" ] || [ -z "$YC_FOLDER_ID" ]; then
            echo "::warning::YC_SERVICE_ACCOUNT_KEY_JSON, YC_CLOUD_ID or YC_FOLDER_ID is missing; Yandex Cloud deploy is skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          key_path="$RUNNER_TEMP/yc-service-account-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key_path"
          yc config profile create github-actions
          yc config set service-account-key "$key_path"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"
          yc config list
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy static site, API Gateway and Cloud Function
        if: steps.yc.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $deployArgs = @("scripts/Deploy-YandexCloud.ps1")
          if ($env:YANDEX_SKIP_SECRET_UPDATE -eq "true") {
            $deployArgs += "-SkipSecretUpdate"
          }
          node scripts/run-powershell.mjs @deployArgs

      - name: Smoke test Yandex Gateway
        if: steps.yc.outputs.enabled == 'true'
        run: npm run smoke:yandex
