name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    env:
      B2E_SITE_URL: ${{ vars.B2E_SITE_URL || 'https://metallb2e-site.pages.dev/' }}
      B2E_CONTACT_PHONE: ${{ vars.B2E_CONTACT_PHONE || '+79650578270' }}
      B2E_CONTACT_PHONE_DISPLAY: ${{ vars.B2E_CONTACT_PHONE_DISPLAY || '+7 (965) 057-82-70' }}
      B2E_WORK_HOURS: ${{ vars.B2E_WORK_HOURS || 'Пн-Пт 09:00 - 18:00' }}
      B2E_CONTACT_EMAIL: ${{ vars.B2E_CONTACT_EMAIL || 'zakaz@b2energy.ru' }}
      B2E_MAX_URL: ${{ vars.B2E_MAX_URL || 'https://max.ru/u/f9LHodD0cOIq9CnGVeR2XIVeHPu_GpeOl3tdE_eGIeC3kbz6i8FikJr_4IM' }}
      B2E_ADDRESS: ${{ vars.B2E_ADDRESS || 'Санкт-Петербург, ул. Седова, 57, лит. В, помещ. 11-Н, ком. 3' }}
      B2E_YANDEX_MAP_URL: ${{ vars.B2E_YANDEX_MAP_URL || 'https://yandex.ru/maps/-/CPSAzCMe' }}
      B2E_YANDEX_MAP_EMBED_URL: ${{ vars.B2E_YANDEX_MAP_EMBED_URL }}
      B2E_RBC_PROFILE_URL: ${{ vars.B2E_RBC_PROFILE_URL || 'https://companies.rbc.ru/amp/ogrn/1247800091098/' }}
      B2E_RUSPROFILE_URL: ${{ vars.B2E_RUSPROFILE_URL || 'https://www.rusprofile.ru/id/1247800091098' }}
      B2E_CATALOG_URL: ${{ vars.B2E_CATALOG_URL || './assets/documents/b2e-metallokonstrukcii-catalog.pdf' }}
      B2E_LEAD_ENDPOINT: ${{ vars.B2E_LEAD_ENDPOINT || 'https://b2e-leads.zakaz-749.workers.dev' }}
      B2E_STATS_ENDPOINT: ${{ vars.B2E_STATS_ENDPOINT || 'https://b2e-leads.zakaz-749.workers.dev/stats' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'metallb2e-site' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm ci --prefix worker

      - name: Test static site and Worker logic
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID variable or CLOUDFLARE_API_TOKEN secret is missing; Cloudflare Pages deploy is skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Cloudflare Pages project exists
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          create_output="$(./worker/node_modules/.bin/wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch=main 2>&1)"
          create_status="$?"
          set -e
          echo "$create_output"
          if [ "$create_status" -ne 0 ] && ! echo "$create_output" | grep -Eiq "already exists|409"; then
            exit "$create_status"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ./worker/node_modules/.bin/wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_SHA"
